name: Internal Build and Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Internal validation artifacts only. Public releases require a separately
# approved trusted signing workflow; this workflow has no publish authority.
permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Test signed-release policy with mocked effects
        run: node --test scripts/release_scripts.test.cjs

      - name: Run tests
        run: swift test

      - name: Build CLI + TUI (universal)
        # --arch both: a native-only build ships arm64 and breaks on Intel
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Build internal macOS app (universal, ad-hoc signed)
        run: >
          xcodebuild -project PortPilot.xcodeproj -target PortPilot
          -configuration Release SYMROOT=.build/xcode
          ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build

      - name: Package internal macOS validation artifacts (not a release)
        run: |
          mkdir -p artifacts
          # Multi-arch SwiftPM builds do NOT produce .build/release — the
          # universal binaries land here instead (verified locally; copying
          # from .build/release/ failed with "no such file").
          cp .build/apple/Products/Release/portpilot artifacts/portpilot-macos-cli
          cp .build/apple/Products/Release/portpilot-tui artifacts/portpilot-macos-tui
          # Ad-hoc validation output must never be attached to a public release.
          ditto -c -k --sequesterRsrc --keepParent .build/xcode/Release/PortPilot.app artifacts/PortPilot-macOS-app-internal-unsigned.zip

      - name: Upload internal macOS validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: portpilot-macos-internal-unsigned
          path: artifacts/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          # 5.9 has no Ubuntu 24.04 build (ubuntu-latest is 24.04) — the
          # setup action 404s resolving it. 6.1 is the oldest line with
          # full 24.04 support and matches the macOS job's toolchain
          # generation; the package is tools-5.9 and builds in v5 mode.
          swift-version: "6.1"

      - name: Run tests
        run: swift test

      - name: Build CLI + TUI
        run: swift build -c release

      - name: Package internal Linux validation artifacts (not a release)
        run: |
          mkdir -p artifacts
          cp .build/release/portpilot artifacts/portpilot-linux-cli
          cp .build/release/portpilot-tui artifacts/portpilot-linux-tui

      - name: Upload internal Linux validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: portpilot-linux-internal-unsigned
          path: artifacts/*
